<meta charset="utf-8">
<title>로로의 해루질</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<style>
/* Layout: full-bleed night-beach canvas; HUD pinned to corners, thumb controls at the bottom,
   panels open as sheets over the paused game. Single dark look by choice (a night beach). */
:root {
  --night-0: #070d22;
  --night-1: #0c1634;
  --night-2: #16234a;
  --night-3: #22336a;
  --lantern: #ffc46b;
  --lantern-ink: #3a2300;
  --tide: #5fd0c4;
  --coral: #ff7a4d;
  --foam: #e8f6ff;
  --muted: #93a4c8;
  --line: rgba(180, 205, 255, .16);
  --panel: rgba(11, 20, 46, .9);
  --font-display: 'Jua', 'Gowun Dodum', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-body: 'Gowun Dodum', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
body {
  background: var(--night-0);
  color: var(--foam);
  font: 15px/1.5 var(--font-body);
  overscroll-behavior: none;
  user-select: none;
  -webkit-user-select: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--lantern); outline-offset: 2px; }

#app { position: fixed; inset: 0; touch-action: none; overflow: hidden; background: var(--night-0); }
#game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#vignette {
  position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse at 50% 55%, transparent 55%, rgba(2, 5, 20, .55) 100%);
}

/* ---------- HUD ---------- */
#hud {
  position: absolute; top: calc(12px + var(--safe-t)); left: calc(12px + var(--safe-l));
  display: grid; gap: 6px; min-width: 188px; padding: 10px 14px 12px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  pointer-events: none;
}
#hud .row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
#hud .label { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
#hud .count { font: 22px/1 var(--font-display); font-variant-numeric: tabular-nums; }
#hud .count small { font-size: 14px; color: var(--muted); }
#hud .bar { height: 8px; border-radius: 99px; background: rgba(255, 255, 255, .1); overflow: hidden; }
#hud .bar i { display: block; height: 100%; width: 0; border-radius: inherit;
  background: linear-gradient(90deg, var(--tide), var(--lantern)); transition: width .3s ease; }
#hud .bar.full i { background: var(--coral); }
#hud .meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
#hud .meta b { color: var(--foam); font-weight: 400; }
#hud .meta b.on { color: var(--lantern); }

#btnMenu {
  position: absolute; top: calc(12px + var(--safe-t)); right: calc(12px + var(--safe-r));
  width: 48px; height: 48px; border-radius: 16px; border: 1px solid var(--line);
  background: var(--panel); display: grid; place-items: center; backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
#btnMenu span, #btnMenu span::before, #btnMenu span::after {
  display: block; width: 20px; height: 2.5px; border-radius: 2px; background: var(--foam); content: '';
}
#btnMenu span { position: relative; }
#btnMenu span::before { position: absolute; top: -7px; }
#btnMenu span::after { position: absolute; top: 7px; }

/* ---------- toasts / prompt ---------- */
#toasts {
  position: absolute; left: 50%; top: calc(76px + var(--safe-t)); transform: translateX(-50%);
  display: grid; gap: 8px; justify-items: center; width: min(92vw, 460px); pointer-events: none;
}
.toast {
  padding: 9px 16px; border-radius: 99px; background: rgba(9, 17, 40, .9);
  border: 1px solid var(--line); font-size: 14px; text-align: center; text-wrap: balance;
  animation: toast-in .25s ease-out, toast-out .4s ease-in 3.2s forwards;
}
.toast.new { border-color: var(--lantern); color: var(--lantern); font-family: var(--font-display); font-size: 16px; }
.toast.warn { border-color: var(--coral); color: #ffd2c2; }
@keyframes toast-in { from { opacity: 0; transform: translateY(-8px); } }
@keyframes toast-out { to { opacity: 0; transform: translateY(-6px); } }

#keyhints {
  position: absolute; left: calc(12px + var(--safe-l)); bottom: calc(12px + var(--safe-b));
  display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); pointer-events: none;
  padding: 6px 12px; border-radius: 99px; background: rgba(7, 13, 34, .6);
}
#keyhints kbd {
  font: 12px var(--font-body); padding: 1px 7px; border-radius: 6px; margin-right: 4px;
  border: 1px solid var(--line); background: rgba(255, 255, 255, .07); color: var(--foam);
}
body.touch #keyhints { display: none; }

/* ---------- touch controls ---------- */
#stickZone { position: absolute; left: 0; top: 18%; bottom: 0; width: 56%; }
#stick { position: absolute; width: 124px; height: 124px; margin: -62px 0 0 -62px; border-radius: 50%;
  border: 2px solid rgba(232, 246, 255, .35); background: rgba(232, 246, 255, .07); pointer-events: none; }
#stick i { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px;
  border-radius: 50%; background: rgba(232, 246, 255, .55); border: 2px solid rgba(255, 255, 255, .7); }

#touchUI { position: absolute; right: calc(16px + var(--safe-r)); bottom: calc(18px + var(--safe-b));
  display: none; gap: 14px; align-items: flex-end; }
body.touch #touchUI { display: flex; }
.round {
  border-radius: 50%; border: 2px solid rgba(255, 255, 255, .28); display: grid; place-items: center;
  background: var(--panel); touch-action: none; font: 15px var(--font-display);
}
#btnLight { width: 58px; height: 58px; }
#btnLight.on { background: #5d4a1c; border-color: var(--lantern); color: var(--lantern); }
#btnNet { width: 92px; height: 92px; background: var(--coral); color: #2a0e02; border-color: #ffd2c2;
  font-size: 20px; box-shadow: 0 6px 22px rgba(255, 122, 77, .35); }
#btnNet:active { transform: scale(.94); }
#btnNet svg, #btnLight svg { display: block; margin: 0 auto 2px; }

#btnHome {
  position: absolute; left: 50%; bottom: calc(20px + var(--safe-b)); transform: translateX(-50%);
  padding: 12px 24px; border-radius: 99px; border: 2px solid var(--lantern);
  background: var(--lantern); color: var(--lantern-ink); font: 18px var(--font-display);
  box-shadow: 0 0 28px rgba(255, 196, 107, .45); animation: pulse 1.6s ease-in-out infinite;
}
@keyframes pulse { 50% { box-shadow: 0 0 40px rgba(255, 196, 107, .8); } }
body.touch #btnHome { bottom: calc(126px + var(--safe-b)); }

/* ---------- screens & sheets ---------- */
.screen {
  position: absolute; inset: 0; display: grid; place-items: center; z-index: 5;
  padding: calc(14px + var(--safe-t)) calc(14px + var(--safe-r)) calc(14px + var(--safe-b)) calc(14px + var(--safe-l));
  background: rgba(3, 7, 22, .62); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
}
#menu { z-index: 7; }
#result { z-index: 8; }
.sheet {
  width: min(100%, 640px); max-height: 100%; display: flex; flex-direction: column;
  background: var(--panel); border: 1px solid var(--line); border-radius: 24px; overflow: hidden;
  box-shadow: 0 24px 70px rgba(0, 0, 0, .5);
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 8px; }
.sheet-head h2 { margin: 0; font: 26px/1.2 var(--font-display); text-wrap: balance; }
.sheet-head .sub { color: var(--muted); font-size: 13px; }
.x { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255, 255, 255, .05); position: relative; }
.x::before, .x::after { content: ''; position: absolute; left: 11px; top: 19px; width: 18px; height: 2px; background: var(--foam); transform: rotate(45deg); }
.x::after { transform: rotate(-45deg); }
.tabs { display: flex; gap: 6px; padding: 4px 20px 10px; overflow-x: auto; }
.tabs button { padding: 7px 16px; border-radius: 99px; border: 1px solid var(--line); background: transparent;
  color: var(--muted); white-space: nowrap; }
.tabs button.on { background: var(--foam); color: var(--night-1); border-color: var(--foam); }
#tabBody, .sheet-body { padding: 6px 20px 18px; overflow-y: auto; min-height: 0; flex: 1; touch-action: pan-y; }
.sheet-foot { display: flex; gap: 10px; justify-content: flex-end; padding: 12px 20px 16px; border-top: 1px solid var(--line); flex-wrap: wrap; }

.btn { padding: 11px 20px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255, 255, 255, .07);
  font: 16px var(--font-display); }
.btn.primary { background: var(--lantern); color: var(--lantern-ink); border-color: var(--lantern); }
.btn.danger { background: var(--coral); color: #2a0e02; border-color: var(--coral); }
.btn:disabled { opacity: .4; cursor: not-allowed; }

/* title */
#title { z-index: 6; background: radial-gradient(ellipse at 50% 70%, rgba(255, 196, 107, .16), transparent 60%), rgba(3, 7, 22, .7); }
.title-card { display: grid; gap: 18px; justify-items: center; text-align: center; max-width: 520px; }
.title-card h1 { margin: 0; font: clamp(44px, 12vw, 76px)/1.05 var(--font-display); color: var(--lantern);
  text-shadow: 0 0 34px rgba(255, 196, 107, .55), 0 3px 0 rgba(0, 0, 0, .35); text-wrap: balance; }
.title-card p { margin: 0; color: #c9d6f2; text-wrap: balance; }
.title-card .gear { display: flex; gap: 14px; align-items: flex-end; justify-content: center; }
.title-card .gear img { height: 76px; width: auto; filter: drop-shadow(0 6px 12px rgba(0, 0, 0, .5)); }
.title-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.title-actions .btn.primary { font-size: 22px; padding: 14px 34px; }
.tiny { font-size: 12px; color: var(--muted); }

/* dex */
.dex-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; color: var(--muted); font-size: 13px; }
.dex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.dex-card { display: grid; grid-template-columns: 72px 1fr; gap: 12px; padding: 12px; border-radius: 16px;
  background: rgba(255, 255, 255, .05); border: 1px solid var(--line); min-width: 0; }
.dex-card.locked { opacity: .65; }
.dex-card canvas { width: 72px; height: 72px; border-radius: 14px; background: radial-gradient(circle at 50% 40%, #2a4a7a, #101c3c); }
.dex-card h3 { margin: 0; font: 19px/1.2 var(--font-display); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.stars { color: var(--lantern); font-size: 12px; letter-spacing: 1px; font-family: var(--font-body); }
.dex-card dl { margin: 4px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; font-size: 13px; }
.dex-card dt { color: var(--muted); }
.dex-card dd { margin: 0; font-variant-numeric: tabular-nums; min-width: 0; }
.dex-card .desc { grid-column: 1 / -1; font-size: 12.5px; color: #b9c8e8; margin: 0; }

/* records / result */
.rec-list { display: grid; gap: 8px; }
.rec-item { display: flex; justify-content: space-between; gap: 12px; align-items: center; width: 100%; text-align: left;
  padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255, 255, 255, .05); }
.rec-item:hover { border-color: var(--lantern); }
.rec-item b { font: 17px var(--font-display); font-weight: 400; }
.rec-item small { color: var(--muted); display: block; }
.rec-total { font: 22px var(--font-display); color: var(--lantern); white-space: nowrap; }
.empty { color: var(--muted); text-align: center; padding: 26px 0; }
.back { margin-bottom: 8px; padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line); background: none; color: var(--muted); }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 6px 0 12px; }
.stat { padding: 10px 12px; border-radius: 14px; background: rgba(255, 255, 255, .06); min-width: 0; }
.stat small { display: block; color: var(--muted); font-size: 12px; }
.stat b { font: 21px/1.3 var(--font-display); font-weight: 400; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.catch-rows { display: grid; gap: 6px; }
.catch-row { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; padding: 6px 10px 6px 6px;
  border-radius: 12px; background: rgba(255, 255, 255, .05); }
.catch-row canvas { width: 44px; height: 44px; border-radius: 10px; background: radial-gradient(circle at 50% 40%, #2a4a7a, #101c3c); }
.catch-row b { font: 17px var(--font-display); font-weight: 400; }
.catch-row .n { font: 20px var(--font-display); font-variant-numeric: tabular-nums; }
.newchip { display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 99px; background: var(--lantern); color: var(--lantern-ink); font: 12px var(--font-body); }
.sec-title { margin: 14px 0 6px; font-size: 13px; color: var(--muted); letter-spacing: .06em; }

/* gear */
.gear-card { display: grid; grid-template-columns: 110px 1fr; gap: 14px; padding: 14px; border-radius: 18px; background: rgba(255, 255, 255, .05);
  border: 1px solid var(--line); margin-bottom: 10px; align-items: center; }
.gear-card img { width: 110px; height: 96px; object-fit: contain; }
.gear-card h3 { margin: 0 0 2px; font: 19px var(--font-display); }
.gear-card p { margin: 0; color: #b9c8e8; font-size: 13px; }
.meter { margin: 8px 0; height: 8px; border-radius: 99px; background: rgba(255, 255, 255, .1); overflow: hidden; }
.meter i { display: block; height: 100%; background: linear-gradient(90deg, var(--tide), var(--lantern)); }
.help-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.help-list li { display: grid; grid-template-columns: 110px 1fr; gap: 12px; align-items: baseline; }
.help-list kbd { font: 13px var(--font-body); padding: 2px 9px; border-radius: 7px; border: 1px solid var(--line); background: rgba(255, 255, 255, .07); margin-right: 4px; }
.toggle { display: inline-flex; gap: 8px; align-items: center; margin-top: 14px; }

@media (max-width: 520px) {
  #hud { min-width: 160px; padding: 8px 12px 10px; }
  .gear-card { grid-template-columns: 84px 1fr; }
  .gear-card img { width: 84px; height: 74px; }
  .help-list li { grid-template-columns: 1fr; gap: 0; }
  .stats { grid-template-columns: 1fr 1fr; }
  #toasts { top: calc(84px + var(--safe-t)); }
}
@media (max-height: 520px) and (orientation: landscape) {
  .sheet-head { padding-top: 10px; }
  .title-card .gear { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .toast, #btnHome { animation: none; }
}

</style>

<div id="app">
  <canvas id="game"></canvas>
  <div id="vignette"></div>
  <div id="stickZone"></div>
  <div id="stick" hidden><i id="knob"></i></div>

  <div id="hud" aria-live="polite">
    <div class="row"><span class="label">조과통</span><span class="count"><span id="hudN">0</span><small> / <span id="hudCap">12</span></small></span></div>
    <div class="bar" id="hudBar"><i></i></div>
    <div class="meta"><span>손전등 <b id="hudLight" class="on">켜짐</b></span><span>탐험 <b id="hudTime">0:00</b></span></div>
  </div>
  <button id="btnMenu" aria-label="메뉴 열기"><span></span></button>

  <div id="toasts"></div>
  <div id="keyhints">
    <span><kbd>WASD</kbd>·<kbd>방향키</kbd>이동</span>
    <span><kbd>Space</kbd>뜰채</span>
    <span><kbd>F</kbd>손전등</span>
    <span><kbd>E</kbd>귀가</span>
    <span><kbd>M</kbd>메뉴</span>
  </div>
  <button id="btnHome" hidden>캠프로 귀가하기</button>

  <div id="touchUI">
    <button id="btnLight" class="round on" aria-label="손전등">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h10l-1.5 6h-7z"/><path d="M9 9v10a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2V9"/><path d="M12 12v3"/></svg>
    </button>
    <button id="btnNet" class="round" aria-label="뜰채 사용">
      <span>
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4c0 8 4 12 10 12 0-6-4-12-10-12z"/><path d="M8 9l3 3M13 16l8 5"/></svg>
        뜰채
      </span>
    </button>
  </div>

  <!-- 타이틀 -->
  <section id="title" class="screen">
    <div class="title-card">
      <h1>로로의<br>해루질</h1>
      <p>잔잔한 밤바다를 걸으며 손전등으로 비추고,<br>뜰채로 건져서 조과통에 담아요.</p>
      <div class="gear" aria-hidden="true"><img id="titleNet" alt=""><img id="titleBox" alt=""></div>
      <div class="title-actions">
        <button id="btnStart" class="btn primary">시작하기</button>
        <button id="btnTitleDex" class="btn">도감</button>
        <button id="btnTitleLog" class="btn">조과 기록</button>
      </div>
      <span class="tiny" id="titleNote">진행 상황은 이 브라우저에 자동 저장돼요.</span>
    </div>
  </section>

  <!-- 메뉴 -->
  <section id="menu" class="screen" hidden>
    <div class="sheet" role="dialog" aria-label="메뉴">
      <div class="sheet-head"><h2 id="menuTitle">메뉴</h2><button id="menuClose" class="x" aria-label="닫기"></button></div>
      <nav class="tabs" role="tablist">
        <button data-tab="dex" class="on" role="tab">도감</button>
        <button data-tab="log" role="tab">조과 기록</button>
        <button data-tab="gear" role="tab">장비</button>
        <button data-tab="help" role="tab">도움말</button>
      </nav>
      <div id="tabBody"></div>
      <div class="sheet-foot">
        <button id="btnGoHome" class="btn">지금 귀가하기</button>
        <button id="btnResume" class="btn primary">계속하기</button>
      </div>
    </div>
  </section>

  <!-- 오늘의 조과 -->
  <section id="result" class="screen" hidden>
    <div class="sheet" role="dialog" aria-label="오늘의 조과">
      <div class="sheet-head"><div><h2 id="resTitle">오늘의 조과</h2><div class="sub" id="resSub"></div></div></div>
      <div class="sheet-body" id="resBody"></div>
      <div class="sheet-foot"><button id="btnResDex" class="btn">도감 보기</button><button id="btnResNext" class="btn primary">다시 바다로</button></div>
    </div>

<script>
/* 로로의 해루질 — 첫 번째 시제품
 * 구성: 데이터 → 월드/지형 → 해산물 그리기 → 상태·저장 → 게임 로직 → 렌더 → UI
 * 제품 사진(assets/net.png, assets/box.png)은 배경 제거만 한 원본 그대로 그립니다.
 */
(() => {
'use strict';

/* ------------------------------------------------------------------ 상수 */
const ASSETS = window.RORO_ASSETS || { net: 'assets/net.png', box: 'assets/box.png' };
const W = 2200, H = 1400;
const HOME = { x: 1100, y: 1290 };
const CAMP_R = 150;
const DEEP = 560;                       // 이 깊이보다 깊은 바다는 못 감
const SAVE_KEY = 'roro-haerujil-v1';
const BASE_CAP = 12, CAP_STEP = 4, UPGRADE_COST = [60, 120, 200, 320, 480];
const BOX_DIST = 108;                    // 조과통이 캐릭터 뒤에서 유지하는 거리
const NET_K = 0.36, NET_PIVOT = { x: 276, y: 116 };
const BOX_W = 98;
const TAU = Math.PI * 2;

const shore = x => 905 + 38 * Math.sin(x / 210 + 0.6) + 22 * Math.sin(x / 83 + 2.1) + 14 * Math.sin(x / 37);
const depthAt = (x, y) => shore(x) - y;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, v) => clamp((v - a) / (b - a), 0, 1);
const angDiff = (a, b) => ((a - b + Math.PI) % TAU + TAU) % TAU - Math.PI;
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ------------------------------------------------------------------ 해산물 데이터 */
const SPECIES = [
  { id: 'conch',    name: '소라',  value: 10, stars: 1, rarity: '흔함',     count: 18, zone: [0, 380],    speed: 0,  desc: '얕은 물가와 갯벌에 많아요. 나선 무늬가 예뻐요.' },
  { id: 'clam',     name: '조개',  value: 8,  stars: 1, rarity: '흔함',     count: 20, zone: [-70, 260],  speed: 0,  desc: '젖은 모래 근처에 얌전히 숨어 있어요.' },
  { id: 'crab',     name: '꽃게',  value: 20, stars: 2, rarity: '보통',     count: 12, zone: [-70, 200],  speed: 1,  desc: '물가를 옆으로 걸어 다녀요. 빛을 비추면 도망쳐요.' },
  { id: 'cucumber', name: '해삼',  value: 25, stars: 2, rarity: '보통',     count: 10, zone: [300, 540],  speed: 1,  desc: '얕은 바다 바닥에서 느릿느릿 기어가요.' },
  { id: 'octopus',  name: '낙지',  value: 45, stars: 3, rarity: '희귀',     count: 6,  zone: [170, 470],  speed: 1,  nearRock: true, desc: '바위 틈에 숨어 있다가 가까이 가면 재빨리 도망쳐요.' },
  { id: 'abalone',  name: '전복',  value: 60, stars: 4, rarity: '매우 희귀', count: 5,  zone: [250, 540],  speed: 0,  nearRock: true, desc: '깊은 쪽 바위에 딱 붙어 있어요. 찾기 어려운 귀한 손님.' },
];
const SP = Object.fromEntries(SPECIES.map(s => [s.id, s]));

function zoneName(x, y, nearRock) {
  const d = depthAt(x, y);
  let z = d < -60 ? '모래사장' : d < 0 ? '젖은 모래 물가' : d < 150 ? '얕은 물가' : d < 380 ? '갯벌 지대' : '얕은 바다';
  return nearRock ? z + ' 바위 틈' : z;
}

/* 바위 (맵 고정) */
const ROCKS = [];
(function () {
  const r = mulberry(777); let tries = 0;
  while (ROCKS.length < 48 && tries++ < 3000) {
    const x = 140 + r() * (W - 280), d = 170 + r() * 380, y = shore(x) - d, rad = 20 + r() * 26;
    if (ROCKS.every(o => Math.hypot(o.x - x, o.y - y) > o.r + rad + 60)) ROCKS.push({ x, y, r: rad, seed: r() });
  }
})();

function spawnAll(seed) {
  const r = mulberry(seed), list = []; let idx = 0;
  for (const sp of SPECIES) {
    for (let n = 0; n < sp.count; n++) {
      let x = 0, y = 0, ok = false, tries = 0;
      while (!ok && tries++ < 300) {
        if (sp.nearRock) {
          const rock = ROCKS[(r() * ROCKS.length) | 0], d0 = depthAt(rock.x, rock.y);
          if (d0 < sp.zone[0] - 40 || d0 > sp.zone[1] + 40) continue;
          const a = r() * TAU, rr = rock.r + 16 + r() * 14;
          x = rock.x + Math.cos(a) * rr; y = rock.y + Math.sin(a) * rr; ok = true;
        } else {
          x = 100 + r() * (W - 200);
          const d = sp.zone[0] + r() * (sp.zone[1] - sp.zone[0]); y = shore(x) - d;
          ok = !ROCKS.some(k => Math.hypot(k.x - x, k.y - y) < k.r + 16);
        }
      }
      if (!ok) continue;
      list.push({ i: idx++, sp: sp.id, x, y, hx: x, hy: y, lit: 0, seen: false, caught: false,
        vx: 0, vy: 0, wt: r() * 3, wdir: r() < .5 ? -1 : 1, ph: r() * 10, nearRock: !!sp.nearRock });
    }
  }
  return list;
}

/* ------------------------------------------------------------------ 해산물 그리기 (귀여운 2D) */
const ell = (c, x, y, rx, ry, rot = 0) => { c.beginPath(); c.ellipse(x, y, rx, ry, rot, 0, TAU); };
const DRAW = {
  conch(c) {
    c.fillStyle = 'rgba(0,0,0,.2)'; ell(c, 2, 5, 15, 9); c.fill();
    c.fillStyle = '#c99b66';
    for (let k = 0; k < 7; k++) {
      const a = k / 7 * TAU + .3; c.beginPath();
      c.moveTo(Math.cos(a) * 11, Math.sin(a) * 9); c.lineTo(Math.cos(a + .18) * 18.5, Math.sin(a + .18) * 15); c.lineTo(Math.cos(a + .42) * 11, Math.sin(a + .42) * 9); c.fill();
    }
    c.fillStyle = '#efd5a8'; ell(c, 0, 0, 14, 11.5); c.fill();
    c.strokeStyle = '#a8683c'; c.lineWidth = 1.9; c.lineCap = 'round'; c.beginPath();
    for (let a = 0; a < 10.2; a += .25) { const r = .8 + 1.3 * a, x = Math.cos(a) * r * .98 - 1, y = Math.sin(a) * r * .8; a ? c.lineTo(x, y) : c.moveTo(x, y); }
    c.stroke();
    c.fillStyle = '#f6aaa0'; ell(c, 8.5, 5.5, 5.2, 3.6, .5); c.fill(); c.strokeStyle = '#c97b6a'; c.lineWidth = 1; c.stroke();
    c.fillStyle = 'rgba(255,255,255,.45)'; ell(c, -6, -6, 3.5, 2, -.6); c.fill();
  },
  clam(c) {
    c.translate(0, -3);
    c.fillStyle = 'rgba(0,0,0,.2)'; ell(c, 1, 14, 17, 5); c.fill();
    const edge = k => { const a = Math.PI * (1.06 + .88 * k / 9), r = 20 + (k % 2 ? 1.8 : 0); return [Math.cos(a) * r, 12 + Math.sin(a) * r * .92]; };
    c.fillStyle = '#f7c4cf'; c.beginPath(); c.moveTo(-4, 12);
    for (let k = 0; k <= 9; k++) c.lineTo(...edge(k));
    c.lineTo(4, 12); c.closePath(); c.fill(); c.strokeStyle = '#e48aa0'; c.lineWidth = 1.4; c.stroke();
    c.strokeStyle = '#e39db0'; c.lineWidth = 1.2;
    for (let k = 1; k < 9; k++) { c.beginPath(); c.moveTo(0, 11); c.lineTo(...edge(k)); c.stroke(); }
    c.fillStyle = '#ecd2ae'; c.fillRect(-5, 10, 10, 5);
    c.fillStyle = 'rgba(255,255,255,.5)'; ell(c, -7, 0, 4, 2, -.5); c.fill();
  },
  crab(c, t) {
    const w = Math.sin(t * 10) * 1.6;
    c.fillStyle = 'rgba(0,0,0,.2)'; ell(c, 0, 8, 19, 7); c.fill();
    c.strokeStyle = '#c4452d'; c.lineWidth = 3; c.lineCap = 'round';
    for (let s = -1; s <= 1; s += 2) for (let k = 0; k < 3; k++) {
      const y = -1 + k * 4.2; c.beginPath(); c.moveTo(s * 9, y); c.lineTo(s * 17, y - 3 + (k % 2 ? w : -w)); c.lineTo(s * 22, y + 4); c.stroke();
    }
    for (let s = -1; s <= 1; s += 2) {   // 집게
      c.lineWidth = 3.4; c.beginPath(); c.moveTo(s * 9, -6); c.lineTo(s * 15, -12); c.stroke();
      c.fillStyle = '#ee6a45'; ell(c, s * 17, -16, 6, 5.4, s * .5); c.fill();
      c.fillStyle = '#17203f'; c.beginPath(); c.moveTo(s * 15, -20.5); c.lineTo(s * 17.5, -15); c.lineTo(s * 20, -20); c.closePath(); c.fill();
    }
    c.fillStyle = '#e0583c'; ell(c, 0, 0, 15, 11); c.fill();
    c.fillStyle = '#f07e5a'; ell(c, 0, -1.5, 11.5, 8); c.fill();
    c.fillStyle = '#ffe3c4'; for (const [x, y] of [[-5, -2], [4, 1], [0, 4.5], [6, -4]]) { ell(c, x, y, 1.5, 1.5); c.fill(); }
    for (let s = -1; s <= 1; s += 2) {   // 눈
      c.strokeStyle = '#c4452d'; c.lineWidth = 1.6; c.beginPath(); c.moveTo(s * 3.5, -9); c.lineTo(s * 4, -13); c.stroke();
      c.fillStyle = '#fff'; ell(c, s * 4, -14, 2.8, 2.8); c.fill(); c.fillStyle = '#111'; ell(c, s * 4, -13.6, 1.4, 1.4); c.fill();
    }
  },
  octopus(c, t) {
    c.fillStyle = 'rgba(0,0,0,.2)'; ell(c, 0, 10, 20, 8); c.fill();
    for (let k = 0; k < 8; k++) {
      const base = (k - 3.5) * .42 + Math.PI / 2; c.strokeStyle = k % 2 ? '#bd8f7d' : '#c79a88'; c.lineCap = 'round';
      c.beginPath();
      let x = Math.cos(base) * 6, y = 4 + Math.sin(base) * 3; c.moveTo(x, y);
      for (let s = 1; s <= 7; s++) {
        const a = base + Math.sin(t * 3 + k + s * .7) * .35 * (s / 7);
        x += Math.cos(a) * 3.6; y += Math.sin(a) * 3.2; c.lineWidth = 5 - s * .55; c.lineTo(x, y);
      }
      c.stroke();

  let gr = ctx.createRadialGradient(HOME.x, HOME.y - 5, 0, HOME.x, HOME.y - 5, 190 * fl); gr.addColorStop(0, 'rgba(255,190,100,.38)'); gr.addColorStop(1, 'rgba(255,170,80,0)'); ctx.fillStyle = gr; ctx.fillRect(HOME.x - 200, HOME.y - 205, 400, 400);
  gr = ctx.createRadialGradient(box.x, box.y - 30, 0, box.x, box.y - 30, 70); gr.addColorStop(0, `rgba(80,130,255,${.22 + box.flash * .3})`); gr.addColorStop(1, 'rgba(80,130,255,0)'); ctx.fillStyle = gr; ctx.fillRect(box.x - 80, box.y - 110, 160, 160);
  // 달빛 윤슬
  const mx = 1500; gr = ctx.createRadialGradient(mx, 120, 0, mx, 120, 420); gr.addColorStop(0, 'rgba(150,190,255,.11)'); gr.addColorStop(1, 'rgba(150,190,255,0)'); ctx.fillStyle = gr; ctx.fillRect(mx - 430, 0, 860, 560);
  const mr = mulberry(4242); ctx.strokeStyle = 'rgba(215,232,255,.8)'; ctx.lineCap = 'round';
  for (let i = 0; i < 90; i++) {
    const x = mx + (mr() - .5) * 300 * (.4 + mr()), y = 20 + mr() * 340; if (y > shore(x) - DEEP + 10 && y > 0 && depthAt(x, y) < DEEP + 40 && false) continue;
    const a = Math.max(0, Math.sin(t * 1.7 + i * 1.9)) * .55; if (a < .05 || x < cam.x - 20 || x > cam.x + vw / zoom + 20 || y < cam.y - 20 || y > cam.y + vh / zoom + 20) continue;
    ctx.globalAlpha = a; ctx.lineWidth = 1.6; const s = 3 + (i % 4); ctx.beginPath(); ctx.moveTo(x - s, y); ctx.lineTo(x + s, y); ctx.moveTo(x, y - s * .7); ctx.lineTo(x, y + s * .7); ctx.stroke();
  }
  ctx.restore();
}
function drawOverlay(t) {
  const c = ctx;
  // 조과통 게이지
  const r = boxRect(), n = pileCount(), cp = cap(), bx = box.x, by = box.y + r.h * .22 + 22, w = 58, h = 17;
  c.fillStyle = 'rgba(6,12,34,.88)'; c.beginPath(); c.roundRect(bx - w / 2, by - h, w, h, 8); c.fill();
  c.fillStyle = n >= cp ? '#ff7a4d' : '#5fd0c4'; c.beginPath(); c.roundRect(bx - w / 2 + 3, by - 5, (w - 6) * Math.min(1, n / cp), 2.6, 1.3); c.fill();
  c.fillStyle = '#e8f6ff'; c.font = '11px "Gowun Dodum", sans-serif'; c.textAlign = 'center'; c.fillText(`${n} / ${cp}`, bx, by - 7.5);
  // 캠프 라벨
  c.font = '15px Jua, "Gowun Dodum", sans-serif'; c.fillStyle = 'rgba(255,224,170,.95)'; c.fillText('로로의 캠프', HOME.x, HOME.y + 88);
  // 가득 찼을 때 방향 화살표
  if (n >= cp && !nearCamp()) {
    const a = Math.atan2(HOME.y - P.y, HOME.x - P.x), ax = P.x + Math.cos(a) * 64, ay = P.y - 6 + Math.sin(a) * 64, pulse = 1 + Math.sin(t * 6) * .12;
    c.save(); c.translate(ax, ay); c.rotate(a); c.scale(pulse, pulse); c.fillStyle = '#ffc46b'; c.beginPath(); c.moveTo(11, 0); c.lineTo(-6, -8); c.lineTo(-2, 0); c.lineTo(-6, 8); c.closePath(); c.fill(); c.restore();
  }

  c.globalAlpha = 1;
}

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2); vw = window.innerWidth; vh = window.innerHeight;
  cvs.width = Math.round(vw * dpr); cvs.height = Math.round(vh * dpr);
  zoom = clamp(Math.min(vw / 720, vh / 520), .8, 1.6);
}
function render(t) {
  const lx = P.x - vw / zoom / 2, ly = P.y - vh / zoom / 2 + 20 / zoom * 0;
  const vwW = vw / zoom, vhH = vh / zoom;
  const tx = vwW >= W ? (W - vwW) / 2 : clamp(lx, 0, W - vwW), ty = vhH >= H ? (H - vhH) / 2 : clamp(ly, 0, H - vhH);
  cam.x += (tx - cam.x) * .18; cam.y += (ty - cam.y) * .18;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#050b22'; ctx.fillRect(0, 0, cvs.width, cvs.height);
  ctx.setTransform(dpr * zoom, 0, 0, dpr * zoom, -cam.x * dpr * zoom, -cam.y * dpr * zoom);
  drawWorld(t); drawDark(t);
  ctx.setTransform(dpr * zoom, 0, 0, dpr * zoom, -cam.x * dpr * zoom, -cam.y * dpr * zoom); drawOverlay(t);
}

/* ------------------------------------------------------------------ HUD */
const $ = id => document.getElementById(id);
let hudKey = '';
function updateHud() {
  const n = pileCount(), cp = cap(), k = `${n}|${cp}|${flashOn}|${Math.floor(state.trip.elapsed)}|${nearCamp()}`;
  if (k === hudKey) return; hudKey = k;
  $('hudN').textContent = n; $('hudCap').textContent = cp;
  $('hudBar').firstElementChild.style.width = Math.min(100, n / cp * 100) + '%'; $('hudBar').classList.toggle('full', n >= cp);
  const hl = $('hudLight'); hl.textContent = flashOn ? '켜짐' : '꺼짐'; hl.classList.toggle('on', flashOn);
  $('btnLight').classList.toggle('on', flashOn); $('hudTime').textContent = fmtClock(state.trip.elapsed);
  const showHome = !paused() && (nearCamp() || n >= cp);
  $('btnHome').hidden = !showHome; $('btnHome').textContent = nearCamp() ? '귀가하기  (E)' : '캠프로 돌아가요';
  $('btnHome').style.pointerEvents = nearCamp() ? 'auto' : 'none'; $('btnHome').style.opacity = nearCamp() ? 1 : .0;
  if (!nearCamp() && n >= cp) { $('btnHome').hidden = true; }
}

/* ------------------------------------------------------------------ 화면(메뉴·결과) */
function stars(n) { return '★'.repeat(n) + '☆'.repeat(4 - n); }
function paintIcons(root) { root.querySelectorAll('canvas[data-sp]').forEach(cv => drawIcon(cv, cv.dataset.sp, cv.dataset.lock === '1')); }

function tabDex() {
  const found = SPECIES.filter(s => state.dex[s.id].first).length;
  let h = `<div class="dex-head"><span>발견한 해산물</span><b>${found} / ${SPECIES.length}</b></div><div class="dex-grid">`;
  for (const s of SPECIES) {
    const d = state.dex[s.id], ok = !!d.first;
    h += `<div class="dex-card ${ok ? '' : 'locked'}"><canvas data-sp="${s.id}" data-lock="${ok ? 0 : 1}"></canvas><div style="min-width:0">
      <h3>${ok ? s.name : '???'} <span class="stars" title="${s.rarity}">${stars(s.stars)}</span></h3>
      <dl><dt>희귀도</dt><dd>${s.rarity}</dd><dt>발견</dt><dd>${d.seen}회 · 채집 ${d.caught}마리</dd>
      <dt>최초 발견</dt><dd>${ok ? d.first : '-'}</dd><dt>발견 장소</dt><dd>${ok ? d.place : '-'}</dd></dl></div>
      <p class="desc">${ok ? s.desc : '아직 만나지 못했어요. 바다를 더 둘러봐요.'}</p></div>`;
  }
  return h + '</div>';
}
function recordHtml(rec) {
  const rows = SPECIES.filter(s => rec.counts[s.id]).map(s => `<div class="catch-row"><canvas data-sp="${s.id}"></canvas><b>${s.name}${rec.newSpecies.includes(s.id) ? '<span class="newchip">NEW</span>' : ''}</b><span class="n">${rec.counts[s.id]}</span></div>`).join('');
  const news = rec.newSpecies.length ? rec.newSpecies.map(id => SP[id].name).join(', ') : '없음';
  return `<div class="stats"><div class="stat"><small>탐험 날짜</small><b>${fmtDateTime(rec.at).slice(0, 14)}</b></div>
    <div class="stat"><small>탐험 시간</small><b>${fmtDur(rec.duration)}</b></div>
    <div class="stat"><small>총 채집</small><b>${rec.total}마리</b></div>
    <div class="stat"><small>채집한 종류</small><b>${Object.keys(rec.counts).length}종</b></div>
    <div class="stat"><small>새로 발견</small><b>${news}</b></div>
    <div class="stat"><small>획득 포인트</small><b>+${rec.points}P</b></div></div>
    <div class="sec-title">해산물별 수량</div>${rows ? `<div class="catch-rows">${rows}</div>` : '<div class="empty">이번에는 아무것도 담지 못했어요. 다음엔 꼭!</div>'}`;
}
function tabLog(openId) {
  if (openId != null) { const rec = state.records.find(r => r.id === openId); if (rec) return `<button class="back" data-back="1">← 기록 목록</button><div class="sec-title" style="margin-top:0">${fmtDateTime(rec.at)}</div>${recordHtml(rec)}`; }
  if (!state.records.length) return '<div class="empty">아직 기록이 없어요.<br>캠프로 돌아가 귀가하면 오늘의 조과가 기록돼요.</div>';
  return '<div class="rec-list">' + state.records.map(r => `<button class="rec-item" data-rec="${r.id}"><span><b>${fmtDateTime(r.at)}</b><small>${fmtDur(r.duration)} · ${Object.keys(r.counts).length}종${r.newSpecies.length ? ` · 새 발견 ${r.newSpecies.length}` : ''}</small></span><span class="rec-total">${r.total}마리</span></button>`).join('') + '</div>';
}
function tabGear() {
  const lv = state.boxLevel, max = UPGRADE_COST.length, cost = UPGRADE_COST[lv];
  return `<div class="gear-card"><img src="${ASSETS.box}" alt="아이씨카샵 조과통"><div><h3>아이씨카샵 조과통</h3>
    <p>수납량 <b>${cap()}</b>마리 · 레벨 ${lv + 1}${lv >= max ? ' (최대)' : ''}</p><div class="meter"><i style="width:${(lv) / max * 100}%"></i></div>
    <p>${lv >= max ? '더 이상 확장할 수 없어요.' : `확장하면 수납량 +${CAP_STEP}마리 (${cost}P)`}</p>
    <div style="margin-top:8px"><button class="btn primary" id="btnUpgrade" ${lv >= max || state.points < cost ? 'disabled' : ''}>${lv >= max ? '최대 레벨' : '수납량 확장'}</button> <span class="tiny">보유 ${state.points}P</span></div></div></div>
    <div class="gear-card"><img src="${ASSETS.net}" alt="맥가이버 뜰채"><div><h3>맥가이버 뜰채</h3><p>둥근 금속 프레임과 철망으로 해산물을 건져요. 스페이스바 또는 뜰채 버튼으로 휘둘러요.</p></div></div>
    <p class="tiny">포인트는 귀가할 때 조과 가치만큼 쌓여요. 소라 10 · 조개 8 · 꽃게 20 · 해삼 25 · 낙지 45 · 전복 60</p>`;
}
function tabHelp() {
  return `<ul class="help-list"><li><span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span><span>이동 (방향키도 가능) · 모바일은 왼쪽 화면을 끌어서 이동</span></li>
    <li><span><kbd>Space</kbd></span><span>뜰채 휘두르기 · 모바일은 주황색 뜰채 버튼</span></li>
    <li><span><kbd>F</kbd></span><span>손전등 켜고 끄기 · 빛이 닿는 곳에서만 해산물이 보여요</span></li>
    <li><span><kbd>E</kbd></span><span>캠프 근처에서 귀가하기</span></li><li><span><kbd>M</kbd> / <kbd>Esc</kbd></span><span>메뉴 열고 닫기</span></li></ul>
    <p class="tiny" style="margin-top:14px">물결이 일렁이는 곳을 비춰 보세요. 꽃게와 낙지는 빛을 받으면 도망가요. 조과통이 가득 차면 캠프로 돌아가 귀가하세요.</p>
    <label class="toggle"><input type="checkbox" id="chkMute" ${state.muted ? 'checked' : ''}> 소리 끄기</label>
    <p style="margin-top:14px"><button class="btn danger" id="btnReset">저장 데이터 모두 지우기</button></p>`;
}
let curTab = 'dex', resetArmed = 0;
function showTab(tab, openId) {
  curTab = tab; document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  const body = $('tabBody'); body.innerHTML = tab === 'dex' ? tabDex() : tab === 'log' ? tabLog(openId) : tab === 'gear' ? tabGear() : tabHelp(); body.scrollTop = 0; paintIcons(body);
  const up = $('btnUpgrade'); if (up) up.onclick = () => { const c_ = UPGRADE_COST[state.boxLevel]; if (c_ != null && state.points >= c_) { state.points -= c_; state.boxLevel++; save(); sfx.catch(); showTab('gear'); hudKey = ''; } };
  body.querySelectorAll('[data-rec]').forEach(b => b.onclick = () => { sfx.click(); showTab('log', +b.dataset.rec); });
  const bk = body.querySelector('[data-back]'); if (bk) bk.onclick = () => showTab('log');
  const mu = $('chkMute'); if (mu) mu.onchange = () => { state.muted = mu.checked; if (master) master.gain.value = state.muted ? 0 : 1; save(); };
  const rs = $('btnReset'); if (rs) rs.onclick = () => { if (!resetArmed) { resetArmed = 1; rs.textContent = '정말 지울까요? 한 번 더 누르세요'; setTimeout(() => { resetArmed = 0; if (rs.isConnected) rs.textContent = '저장 데이터 모두 지우기'; }, 3500); return; }
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {} state = freshState(); setupTrip(); save(); resetArmed = 0; hudKey = ''; showTab('dex'); toast('저장 데이터를 지웠어요'); };
}
function openMenu(tab = 'dex') {
  ui.menu = true; $('menu').hidden = false; $('menuTitle').textContent = ui.title ? '도감 · 기록' : '메뉴'; $('btnGoHome').hidden = ui.title; $('btnResume').textContent = ui.title ? '닫기' : '계속하기';
  armHome = 0; $('btnGoHome').textContent = '지금 귀가하기'; $('btnGoHome').classList.remove('danger'); showTab(tab); sfx.click();
}
function closeMenu() { ui.menu = false; $('menu').hidden = true; sfx.click(); save(); hudKey = ''; }
let armHome = 0;

function finishTrip() {
  const t = state.trip, counts = countsOf(t.pile), total = t.pile.length, points = t.pile.reduce((s, id) => s + SP[id].value, 0);
  const rec = { id: Date.now(), at: t.startedAt, duration: t.elapsed, counts, total, newSpecies: t.newSpecies.slice(), points };
  state.records.unshift(rec); state.records = state.records.slice(0, 50); state.points += points;
  state.trip = newTrip(); setupTrip(); save();
  ui.menu = false; $('menu').hidden = true; ui.result = true;
  $('resSub').textContent = fmtDateTime(rec.at); $('resBody').innerHTML = recordHtml(rec); paintIcons($('resBody')); $('result').hidden = false; $('resBody').scrollTop = 0;
  sfx.fresh(); hudKey = '';
}

/* ------------------------------------------------------------------ 입력 */
function bindInput() {
  addEventListener('keydown', e => {
    audioInit();
    if (e.repeat) { if (e.code === 'Space') e.preventDefault(); return; }
    if (e.code === 'KeyM' || e.code === 'Escape') { if (ui.result || ui.title) return; ui.menu ? closeMenu() : openMenu(); e.preventDefault(); return; }
    if (paused()) return;
    if (e.code === 'Space') { startSwing(); e.preventDefault(); }
    else if (e.code === 'KeyF') toggleLight();
    else if (e.code === 'KeyE' && nearCamp()) finishTrip();
    else if (e.code.startsWith('Arrow') || e.code.startsWith('Key')) { keys.add(e.code); if (e.code.startsWith('Arrow')) e.preventDefault(); }
  });
  addEventListener('keyup', e => keys.delete(e.code));
  addEventListener('blur', () => { keys.clear(); stick.x = stick.y = 0; });
  // 가상 조이스틱
  const zone = $('stickZone'), st = $('stick'), knob = $('knob');
  zone.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' || stick.id !== null || paused()) return; audioInit(); document.body.classList.add('touch');
    stick.id = e.pointerId; stick.ox = e.clientX; stick.oy = e.clientY; zone.setPointerCapture(e.pointerId);
    st.hidden = false; st.style.left = e.clientX + 'px'; st.style.top = e.clientY + 'px'; knob.style.transform = '';
  });
  zone.addEventListener('pointermove', e => {
    if (e.pointerId !== stick.id) return; let dx = e.clientX - stick.ox, dy = e.clientY - stick.oy; const m = Math.hypot(dx, dy), R = 52;
    if (m > R) { dx = dx / m * R; dy = dy / m * R; } stick.x = dx / R; stick.y = dy / R; if (Math.hypot(stick.x, stick.y) < .18) { stick.x = stick.y = 0; } knob.style.transform = `translate(${dx}px,${dy}px)`;
  });
  const end = e => { if (e.pointerId !== stick.id) return; stick.id = null; stick.x = stick.y = 0; st.hidden = true; };
  zone.addEventListener('pointerup', end); zone.addEventListener('pointercancel', end);
  const hold = (el, fn) => el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); audioInit(); if (e.pointerType !== 'mouse') document.body.classList.add('touch'); fn(); });
  hold($('btnNet'), startSwing); hold($('btnLight'), toggleLight);
  $('btnHome').addEventListener('click', () => { if (nearCamp()) finishTrip(); });
  $('btnMenu').addEventListener('click', () => { audioInit(); if (!paused()) openMenu(); });
  $('menuClose').onclick = closeMenu; $('btnResume').onclick = closeMenu;
  $('menu').addEventListener('pointerdown', e => { if (e.target === $('menu')) closeMenu(); });
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { sfx.click(); showTab(b.dataset.tab); });
  $('btnGoHome').onclick = () => {
    if (!armHome) { armHome = 1; const b = $('btnGoHome'); b.textContent = '정말 귀가할까요? 한 번 더 누르기'; b.classList.add('danger'); setTimeout(() => { armHome = 0; b.textContent = '지금 귀가하기'; b.classList.remove('danger'); }, 3500); return; }
    armHome = 0; finishTrip();
  };
  $('btnResNext').onclick = () => { ui.result = false; $('result').hidden = true; sfx.click(); toast('새로운 탐험을 시작해요. 바다로 가볼까요?'); };
  $('btnResDex').onclick = () => { ui.result = false; $('result').hidden = true; openMenu('dex'); };
  $('btnStart').onclick = () => { audioInit(); sfx.click(); ui.title = false; $('title').hidden = true; hudKey = ''; if (!state.trip.pile.length && state.trip.elapsed < 1) { toast('손전등을 비추며 바다 쪽(위)으로 걸어가 보세요'); setTimeout(() => toast(document.body.classList.contains('touch') ? '해산물 가까이에서 주황색 뜰채 버튼을 눌러요' : '해산물 가까이에서 스페이스바로 뜰채를 휘둘러요'), 3600); } };
  $('btnTitleDex').onclick = () => { audioInit(); openMenu('dex'); }; $('btnTitleLog').onclick = () => { audioInit(); openMenu('log'); };
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); }); addEventListener('pagehide', save);
  addEventListener('resize', resize);
  if (matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window) document.body.classList.add('touch');
}
function toggleLight() { flashOn = !flashOn; state.trip.flash = flashOn; sfx.light(); hudKey = ''; queueSave(); }

/* ------------------------------------------------------------------ 시작 */
let last = 0;
function frame(ms) {
  const t = ms / 1000, dt = Math.min(.05, t - last || .016); last = t;
  if (!paused()) update(dt); else time += dt * .5;
  render(time); updateHud(); requestAnimationFrame(frame);
}
async function boot() {
  load(); resize(); bindInput(); setupTrip();
  $('titleNet').src = ASSETS.net; $('titleBox').src = ASSETS.box;
  const prog = state.trip.pile.length || state.trip.elapsed > 20;
  if (prog) { $('btnStart').textContent = '이어서 하기'; $('titleNote').textContent = `이전 탐험을 이어서 할 수 있어요 · 조과통 ${state.trip.pile.length}마리`; }
  await Promise.all([loadImg('net', ASSETS.net), loadImg('box', ASSETS.box)]);
  buildTerrain(); cam.x = P.x - vw / zoom / 2; cam.y = P.y - vh / zoom / 2;
  window.RORO_DEBUG = { state: () => state, P, box, seafood: () => seafood, startSwing, finishTrip, toggleLight, ui, cap, ROCKS, depthAt, lightAt, tryCatch };
  requestAnimationFrame(frame);
}
boot();
})();

</script>
